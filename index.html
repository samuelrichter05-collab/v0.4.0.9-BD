function updateAreaTowers(dt){
 // Recompute strongest slow every combat frame. Destroyed towers stop contributing.
 for(const e of state.enemies)e.cryoSlow=0;
 for(const t of state.towers){
  if(t.hp<=0||!['cryo','flame'].includes(t.type))continue;
  const cfg=NEW_TOWER_CONFIG[t.type],range=coneRange(t),target=nearestEnemy(t.x,t.y,range);t.firing=!!target;
  if(t.type==='flame'){
   if(target){t.idleHeat=0;t.heat=Math.min(cfg.heatCap[t.overheat]-1,(t.heat||0)+cfg.heatGain[t.overheat]*dt)}
   else{const old=t.idleHeat||0;t.idleHeat=old+dt;t.heat=Math.max(0,(t.heat||0)-cfg.coolingRate*Math.max(0,t.idleHeat-Math.max(old,cfg.coolingDelay[t.overheat])))}
  }
  if(!target)continue;updateTowerVisual(t,target,dt);
  for(const e of state.enemies){
   if(!inSector(t,e,range,coneArc(t),t.facingAngle))continue;
   if(t.type==='cryo'){
    const zone=Math.min(2,Math.floor(dist(t,e)/range*3));e.cryoSlow=Math.max(e.cryoSlow,Math.min(cfg.slowCap,cfg.slowZones[zone]*t.frostStrength));

   }else{

   }

}

function softSprite(kind){

 const colors={frost:['rgba(191,246,255,.55)','rgba(126,220,248,.20)'],red:['rgba(249,72,24,.7)','rgba(255,89,24,.25)'],gold:['rgba(255,221,119,.95)','rgba(255,154,40,.35)']};
 const size=CONE_VISUAL_CONFIG.spriteSize,canvas=document.createElement('canvas');canvas.width=canvas.height=size;const c=canvas.getContext('2d'),g=c.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
 g.addColorStop(0,colors[kind][0]);g.addColorStop(.45,colors[kind][1]);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,size,size);softSprites.set(kind,canvas);return canvas;
}
function drawTowerCones(){
 const config=CONE_VISUAL_CONFIG,time=saveData.settings.reducedMotion?0:state.visualTime;
 for(const t of state.towers){
  if(t.hp<=0||!t.firing||!['cryo','flame'].includes(t.type))continue;
  const frost=t.type==='cryo',range=coneRange(t),arc=coneArc(t),heat=t.heat||0;
  ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.facingAngle||0);
  if(frost){
   const sprite=softSprite('frost');
   for(let row=0;row<config.frostRows;row++)for(let lane=0;lane<config.frostLanes;lane++){
    const f=(row+.5)/config.frostRows,a=(lane/(config.frostLanes-1)-.5)*arc*.85,drift=Math.sin(time*2.7+row*1.9+lane)*range*.012;
    const x=Math.cos(a)*range*f,y=Math.sin(a)*range*f+drift,size=range*(.24+f*.12);
    ctx.globalAlpha=(.32+.16*Math.sin(row*1.7+lane))*Math.pow(1-f,.45);ctx.drawImage(sprite,x-size/2,y-size/2,size,size);
   }
   ctx.globalAlpha=.55;for(let i=0;i<8;i++){const f=(i/8+time*.45)%1,a=Math.sin(i*4.1)*arc*.39;ctx.fillStyle='#c7f7ff';ctx.fillRect(Math.cos(a)*range*f,Math.sin(a)*range*f,1.5,1.5)}
  }else{
   // Soft red envelope plus independently moving, tapered flame tongues.
   const outer=softSprite('red'),core=softSprite('gold');
   for(let i=0;i<config.flameTongues;i++){
    const lane=i/(config.flameTongues-1)-.5,angle=lane*arc*.85,length=range*(.84+.12*Math.sin(time*11+i*3.7));
    ctx.save();ctx.rotate(angle);
    // Overlapping soft sprites follow each moving tongue. Every lateral edge and
    // tip fades to transparent, avoiding both solid triangles and a sector outline.
    for(let knot=0;knot<6;knot++){
     const f=(knot+.5)/6,travel=f*length,side=Math.sin(time*12-f*7+i*2.3)*range*.035*f;
     const width=range*(.22*(1-f)+.055)*(1+.12*Math.sin(time*9+i+knot));
     ctx.globalAlpha=(.75-.35*f)*(1-.3*Math.abs(lane));ctx.drawImage(outer,travel-width*1.5,side-width*.7,width*3,width*1.4);
     ctx.globalAlpha=(.80+heat*.15)*Math.pow(1-f,.55);ctx.drawImage(core,travel-width*1.4,side-width*.38,width*2.8,width*.76);
    }
    ctx.restore();
   }
   for(let i=0;i<config.embers;i++){const f=(i/config.embers+time*(.7+heat*.1))%1,a=Math.sin(i*8.7+time*.3)*arc*.42;ctx.globalAlpha=(1-f)*.65;ctx.fillStyle=i%2?'#ffe58a':'#ff7d35';circle(Math.cos(a)*range*f,Math.sin(a)*range*f,1.1+heat*.6,ctx.fillStyle)}
  }
  ctx.restore();
 }
}

 const area=swordAttackArea();return [-1,1].map(side=>{const a=area.angle+side*area.arc/2;return {x0:p.x+Math.cos(a)*HERO_POLISH.guideStart,y0:p.y+Math.sin(a)*HERO_POLISH.guideStart,x1:p.x+Math.cos(a)*area.radius,y1:p.y+Math.sin(a)*area.radius,angle:a,radius:area.radius}});
}

 ctx.restore();

// SAVE SYSTEM — one atomic localStorage document, with recoverable pending payout.
const SAVE_KEY='baseDefender.v0401.save';
const metaRoot=document.getElementById('meta');
const saveWarning=document.getElementById('save-warning');
let storageAvailable=true;
function defaultSave(){return {version:'0.4.0.9',waveNumberingVersion:2,baseLevel:1,selectedHeroClass:'archer',heroSkills:{archer:{piercingArrow:0,multishot:0,burningArrow:0},swordsman:{adrenaline:0,bloodlust:0,battleHardened:0}},crystals:0,bestWave:0,totalRuns:0,totalEnemiesKilled:0,totalPlayerKills:0,totalPlayTime:0,bestCombo:0,unlockedPowerUps:{fireball:false,emp:false,dynamite:false},powerUpLevels:{},permanentPowerLevels:{fireball:1,emp:1,dynamite:1,tornado:1,healing:1},selectedPowerUps:[null],bossBadges:{},settings:{reducedMotion:false},pendingReward:null,lastRewardRunId:null}}
function isRecord(v){return v!==null&&typeof v==='object'&&!Array.isArray(v)}
function nonnegative(v,fallback=0){return typeof v==='number'&&Number.isFinite(v)&&v>=0?v:fallback}
function normalizeSave(raw){
 const d=defaultSave(),s=isRecord(raw)?{...d,...raw}:d;
 for(const key of ['crystals','bestWave','totalRuns','totalEnemiesKilled','totalPlayerKills','totalPlayTime','bestCombo'])s[key]=nonnegative(s[key]);
 for(const key of ['crystals','bestWave','totalRuns','totalEnemiesKilled','totalPlayerKills','bestCombo'])s[key]=Math.floor(s[key]);
 s.settings={...d.settings,...(isRecord(s.settings)?s.settings:{})};s.settings.reducedMotion=s.settings.reducedMotion===true;
 s.unlockedPowerUps={...d.unlockedPowerUps,...(isRecord(s.unlockedPowerUps)?s.unlockedPowerUps:{})};
 s.powerUpLevels=isRecord(s.powerUpLevels)?s.powerUpLevels:{};
 for(const [id,def] of Object.entries(POWER_UP_CONFIG)){
  s.unlockedPowerUps[id]=s.unlockedPowerUps[id]===true;
  const levels=isRecord(s.powerUpLevels[id])?{...s.powerUpLevels[id]}:{};
  for(const [key,branch] of Object.entries(def.branches))levels[key]=Math.min(branch.costs.length,Math.floor(nonnegative(levels[key])));
  s.powerUpLevels[id]=levels;
 }
 const permanent=isRecord(s.permanentPowerLevels)?s.permanentPowerLevels:{};s.permanentPowerLevels={};
 for(const id of Object.keys(POWER_UP_CONFIG))s.permanentPowerLevels[id]=clamp(Math.floor(nonnegative(permanent[id],1)),1,3);
 s.bossBadges=normalizeBossBadges(s.bossBadges);
 normalizeProgression(s,raw);
 if(isRecord(raw)&&raw.jungleWaveVersion!==1){s.bestWaveV031=s.bestWave;s.bestWave=0;s.jungleWaveVersion=1;if(isRecord(s.pendingReward)&&isRecord(s.pendingReward.stats))s.pendingReward={...s.pendingReward,stats:{...s.pendingReward.stats,waveReachedV031:s.pendingReward.stats.waveReached,waveReached:0}};}
 if(isRecord(raw)&&raw.waveNumberingVersion!==WAVE_CONFIG.numberingVersion){
  s.bestWavePreviousNumbering=Math.max(nonnegative(s.bestWavePreviousNumbering),s.bestWave);
  s.bestWave=Math.max(0,s.bestWave-WAVE_CONFIG.removedEarlyWaves);
  if(isRecord(s.pendingReward)&&isRecord(s.pendingReward.stats))s.pendingReward={...s.pendingReward,stats:{...s.pendingReward.stats,waveReached:Math.max(1,nonnegative(s.pendingReward.stats.waveReached,1)-WAVE_CONFIG.removedEarlyWaves)}};
 }
 if(!isRecord(s.bestJungleRun)||!isRecord(s.bestJungleRun.performance)||!isRecord(s.bestJungleRun.performance.towers)||!isRecord(s.bestJungleRun.performance.powers)||!isRecord(s.bestJungleRun.performance.hero)||!isRecord(s.bestJungleRun.hero)||!Array.isArray(s.bestJungleRun.towers)||!Array.isArray(s.bestJungleRun.powers))s.bestJungleRun=null;
 s.waveNumberingVersion=WAVE_CONFIG.numberingVersion;s.version='0.4.0.9';
 if(!isRecord(s.pendingReward)||typeof s.pendingReward.id!=='string'||!isRecord(s.pendingReward.stats)||!Number.isFinite(s.pendingReward.amount)||s.pendingReward.amount<0)s.pendingReward=null;
 return s;
}
function storageStatus(ok){storageAvailable=ok;saveWarning.hidden=ok;saveWarning.textContent=ok?'':'Saving unavailable. Progress is kept only for this session.'}
function loadSave(){
 try{
  const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem('baseDefender.v040.save')||localStorage.getItem('baseDefender.save');
  if(!raw)return defaultSave();
  try{return normalizeSave(JSON.parse(raw))}catch(error){
   // Keep an unreadable document for recovery instead of silently destroying it.
   localStorage.setItem(SAVE_KEY+'.unreadable.'+Date.now(),raw);return defaultSave();
  }
 }catch(error){storageStatus(false);return defaultSave()}
}
let saveData=normalizeSave(loadSave());
function persistSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(saveData));storageStatus(true);return true}catch(error){storageStatus(false);return false}}
function addPermanentStats(stats){
 saveData.totalRuns++;saveData.bestWave=Math.max(saveData.bestWave,nonnegative(stats.waveReached));
 saveData.totalEnemiesKilled+=nonnegative(stats.totalKills);saveData.totalPlayerKills+=nonnegative(stats.playerKills);
 saveData.totalPlayTime+=nonnegative(stats.survivalTime);saveData.bestCombo=Math.max(saveData.bestCombo,nonnegative(stats.bestCombo));
}
function settlePendingReward(){
 const pending=saveData.pendingReward;if(!pending)return;
 if(saveData.lastRewardRunId!==pending.id){saveData.crystals+=Math.floor(pending.amount);addPermanentStats(pending.stats);saveData.lastRewardRunId=pending.id}
 saveData.pendingReward=null;persistSave();
}
settlePendingReward();persistSave();

// Earliest contact with the full capsule, including both endpoint caps.

   const q=item.wall?nearestOnWall(unit,item):item,dx=unit.x-q.x,dy=unit.y-q.y,d=Math.hypot(dx,dy),need=unit.r+item.r+.1;
   if(d>=need)continue;const a=d>1e-8?Math.atan2(dy,dx):Math.atan2(unit.y-H/2,unit.x-W/2);unit.x=q.x+Math.cos(a)*need;unit.y=q.y+Math.sin(a)*need;changed=true;

function reachableTarget(e,t){const hit=firstWallHit(e,targetPoint(e,t),0);return !hit||hit.wall===t}

function localCombatTarget(e){

function chooseJungleTarget(e){

  const combat=e.type==='boss'?null:localCombatTarget(e);if(combat)return combat;

  const cache=e.breachCache,needs=!cache||cache.revision!==state.navRevision||cache.wall!==block.wall||dist(e,cache.origin)>22||cache.time<=state.visualTime;
  if(needs)e.breachCache={revision:state.navRevision,wall:block.wall,origin:{x:e.x,y:e.y},time:state.visualTime+.45,goal:localBreachGoal(e,block.wall)};

function localBreachGoal(e,target){

  if(gap.hp>0||gap.ring!==target.ring||dist(e,gap)-e.r>cfg.localBreachDistance)continue;
  const a=Math.atan2(gap.y-H/2,gap.x-W/2);if(Math.abs(Math.atan2(Math.sin(a-angle),Math.cos(a-angle)))>cfg.localBreachAngle)continue;

function updateJungleEnemies(dt){

 for(const e of state.enemies){
  if(e.hp<=0)continue;const def=enemyDefs[e.type];e.cd=Math.max(0,e.cd-dt);
  if(e.stunTime>0){e.stunTime=Math.max(0,e.stunTime-dt);e.meleeAttack=null;continue}
  if(e.cryoSlow>0){const perf=towerPerformance('cryo');if(perf)perf.slowEnemySeconds+=dt;}
  const t=chooseJungleTarget(e);e.target=t;const soldier=nearbySoldier(e),speed=e.spd*(1-(e.cryoSlow||0))*(soldier?COMBAT_CONFIG.soldierSlow:1);
  if(e.type==='boss'||e.type==='spitter')updateBossAndSpitter(e,dt);
  // A soldier can be attacked in passing; it never replaces the movement destination.
  let busy=false;if(e.meleeAttack){const a=e.meleeAttack;updateBruteAttack(e,dt);busy=true;if(!isBarracksUnit(a.target))continue;}
  if(!t)continue;
  if(t!==state.base)state.targetCounts.set(t,(state.targetCounts.get(t)||0)+1);
  const q=targetPoint(e,t),reach=def.behavior==='ranged'?Math.max(e.range,e.r+t.r+PATCH_CONFIG.meleePadding):e.r+t.r+PATCH_CONFIG.meleePadding;
  if(e.breachGoal){steerTo(e,e.breachGoal,dt,speed);faceEntity(e,e.breachGoal)}else{
   faceEntity(e,q);const longRangeSiege=e.type==='spitter'&&e.fireAim&&dist(e,e.fireAim)<=def.fireRange&&validDefenseTargets().some(target=>areaContains({...e.fireAim,r:COMBAT_CONFIG.fire.spitterRadius},target));
   if((targetDistance(e,t)>reach||!reachableTarget(e,t))&&!longRangeSiege)steerTo(e,defenseGoal(e,t),dt,speed);
  }
  if(busy&&e.meleeAttack)e.facingAngle=e.meleeAttack.angle;
  if(busy||e.cd>0)continue;
  const contact=soldier&&(def.behavior==='ranged'?Math.max(e.range,e.r+soldier.r+2):e.r+soldier.r+2),attackTarget=soldier&&dist(e,soldier)<=contact+.2?soldier:!e.breachGoal&&targetDistance(e,t)<=reach+.2&&reachableTarget(e,t)?t:null;

}

function separateEnemies(){

 const cell=Math.max(24,...live.map(e=>e.r*2+cfg.separationGap));
 for(let pass=0;pass<cfg.separationPasses;pass++){
  const buckets=new Map();for(const e of live){const k=Math.floor(e.x/cell)+','+Math.floor(e.y/cell);if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push(e)}
  for(const e of live){const cx=Math.floor(e.x/cell),cy=Math.floor(e.y/cell);for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)for(const other of buckets.get((cx+ox)+','+(cy+oy))||[]){if(e.id>=other.id)continue;
   let dx=other.x-e.x,dy=other.y-e.y,d=Math.hypot(dx,dy),need=e.r+other.r+cfg.separationGap;if(d>=need)continue;
   if(d<.0001){const a=(e.id*2.399+other.id)%TAU;dx=Math.cos(a);dy=Math.sin(a);d=1e-3}else{dx/=d;dy/=d}
   const overlap=need-d,mass=e.r*e.r+other.r*other.r,share=other.r*other.r/mass;

   const moved=dist(old,e);movePhysical(other,dx*(overlap-moved),dy*(overlap-moved),!!enemyDefs[other.type].flying);
  }}

}

 if(targetDistance(e,t)<=reach+.2)return true;
 return freePosition(goal,e.r,false,e)&&(clearTravel(e,goal,e.r,false,e)||findRoute(e,goal).length>0);
}

function wallBreakerTarget(e){
 const counts=state.targetCounts||new Map(),walls=state.walls.filter(w=>w.hp>0);
 walls.sort((a,b)=>(targetDistance(e,a)+(counts.get(a)||0)*PATCH_CONFIG.navigation.occupancyPenalty)-(targetDistance(e,b)+(counts.get(b)||0)*PATCH_CONFIG.navigation.occupancyPenalty));
 for(const wall of walls)if(canReachDefense(e,wall))return wall;
 const towers=state.towers.filter(t=>t.hp>0).sort((a,b)=>dist(e,a)-dist(e,b));
 for(const tower of towers)if(canReachDefense(e,tower))return tower;
 return towers[0]||state.base;
}

function powerUnlocked(id,s=saveData){return Object.hasOwn(POWER_UP_CONFIG,id)&&(PATCH405_CONFIG.testUnlockAll||!!s.unlockedPowerUps[id])}

function towerBonus(level,key){
 let bonus=0,previous=1;for(const tier of PATCH405_CONFIG.towerTiers){bonus+=Math.max(0,Math.min(level,tier.through)-previous)*tier[key];previous=tier.through;if(level<=previous)break}return bonus;
}

function towerRepairCost(t){return roundRunGold((t.totalGoldInvested??towerDefs[t.type].cost)*PATCH405_CONFIG.repairFraction)}

function repairTower(t){
 if(!gameplayActive()||state.gameover||!t||t.hp>0||!state.towers.includes(t))return false;
 const cost=towerRepairCost(t);if(state.gold<cost){state.notice='Not enough gold';state.noticeT=1;return false}
 state.gold=roundRunGold(state.gold-cost);t.totalGoldInvested=roundRunGold((t.totalGoldInvested??towerDefs[t.type].cost)+cost);
 applyTowerLevel(t,Math.max(1,t.level-1));t.hp=t.max;t.destroyed=false;t.poison=null;t.heat=0;t.cd=.2;t.spawn=t.rate;invalidateNavigation();return true;
}

function drawTowerRuin(t){
 ctx.save();ctx.translate(t.x,t.y);circle(0,0,17,'#393c35','#a48c63');techPolygon([[-12,7],[-9,-4],[-3,-1],[0,-9],[6,-3],[11,8]],'#656359','#aaa18b');techLine([[-10,9],[10,-7]],'#37372f',4);ctx.fillStyle='#e2c99a';ctx.font='bold 8px system-ui';ctx.textAlign='center';ctx.fillText('RUIN',0,25);ctx.restore();
}

function drawRepairMenu(t){
 const r=sideMenuRect(),b=towerUpgradeButtonRect(),cost=towerRepairCost(t),available=state.gold>=cost;
 menuPanel(r,towerDefs[t.type].name);ctx.fillStyle='#e2b482';ctx.font='bold 11px system-ui';ctx.textAlign='left';ctx.fillText('DESTROYED',r.x+12,r.y+39);
 paintTechPanel(b.x,b.y,b.w,b.h,available?HUD_CONFIG.row:HUD_CONFIG.disabledRow,available?UI_THEME.accent:UI_THEME.border);ctx.fillStyle=available?UI_THEME.text:UI_THEME.disabled;ctx.textAlign='center';ctx.font='bold 11px system-ui';ctx.fillText('REPAIR',b.x+b.w/2,b.y+15);ctx.font='10px system-ui';ctx.fillText(Math.round(cost)+' GOLD',b.x+b.w/2,b.y+31);
 ctx.textAlign='left';ctx.fillStyle=UI_THEME.muted;ctx.fillText('Level after repair: '+Math.max(1,t.level-1),r.x+12,r.y+106);const n=rebuildButtonRect();paintTechPanel(n.x,n.y,n.w,n.h,HUD_CONFIG.row,UI_THEME.accent);ctx.fillStyle=UI_THEME.text;ctx.textAlign='center';ctx.font='bold 10px system-ui';ctx.fillText('BUILD NEW TOWER',n.x+n.w/2,n.y+15);
}

function wallAnchors(){return ['outer','inner'].flatMap(ring=>(ring==='outer'?PATCH_CONFIG.outerAngles:PATCH_CONFIG.innerAngles).map((degrees,i)=>{const angle=degrees*Math.PI/180,r=ringRadius(ring);return {x:W/2+Math.cos(angle)*r,y:H/2-Math.sin(angle)*r,slot:(ring==='outer'?0:8)+i,ring,angle}}))}

function hostileImpactPoint(e,point){const hit=firstWallHit(e,point,0);return hit?{x:hit.wall.x,y:hit.wall.y}:point}

function hostileAreaContains(z,t){const hit=firstWallHit(z,targetPoint(z,t),0);return areaContains(z,t)&&(!hit||hit.wall===t)}

function thinEarlyQueue(queue,count=Math.round(queue.length*PATCH406_CONFIG.earlyWaveMultiplier)){return Array.from({length:count},(_,i)=>queue[Math.floor(i*queue.length/count)])}

function targetedPowerReady(){return state.player.hp>0&&!state.gameover&&state.powerUps.some(p=>POWER_UP_CONFIG[p.id]?.targeted&&p.cooldown<=0)}

function rebuildButtonRect(){const r=sideMenuRect();return {x:r.x+8,y:r.y+114,w:r.w-16,h:23}}

function normalizeBossBadges(raw){
 const result={};for(const [arena,defs] of Object.entries(PATCH406_CONFIG.bossBadges))result[arena]=defs.filter(d=>Array.isArray(raw?.[arena])&&raw[arena].includes(d.size)).map(d=>d.size);return result;
}

function awardBossBadge(arena,size){
 const def=PATCH406_CONFIG.bossBadges[arena]?.find(d=>Math.abs(d.size-size)<.001);if(!def)return false;
 saveData.bossBadges??={};const earned=saveData.bossBadges[arena]??=[];if(earned.includes(def.size))return false;
 earned.push(def.size);saveData.crystals+=def.reward;persistSave();state.notice='BOSS BADGE '+def.size.toFixed(1)+'× · +'+def.reward+' CRYSTALS';state.noticeT=4;return true;
}

function renderArenaSelection(){
 return `<section class="arena-card" aria-label="Arena Selection"><h2>ARENA SELECTION · JUNGLE ✓</h2><small>First defeat of each Boss size earns a permanent badge and Crystals.</small><div class="boss-badges">${PATCH406_CONFIG.bossBadges.jungle.map(d=>{const earned=saveData.bossBadges?.jungle?.includes(d.size);return `<div class="boss-badge ${earned?'earned':'locked'}" aria-label="${d.size.toFixed(1)}x Boss: ${earned?'Defeated':'Locked'}"><span class="boss-medal" style="width:${d.pixels}px;height:${d.pixels}px">★</span><b>${d.size.toFixed(1)}×</b><span>${earned?'✓ EARNED':'LOCKED'}</span><small>${d.reward} Crystals</small></div>`}).join('')}</div></section>`;
}

function healUnit(target,amount){
 if(target.hp<=0||amount<=0)return 0;const before=target.hp;target.hp=Math.min(target.max,target.hp+amount);const healed=target.hp-before;const perf=powerPerformance('healing');if(perf)perf.healing+=healed;if(target===state.player&&state.run?.performance)state.run.performance.hero.healing+=healed;addDamageNumber(target,healed,true,true);return healed;
}

function bossBaseTarget(e){
 const base=state.base,reach=e.r+base.r+PATCH_CONFIG.meleePadding,goal=defenseGoal(e,base);
 e.breachGoal=null;
 if(targetDistance(e,base)<=reach+.2&&reachableTarget(e,base))return base;
 if(clearTravel(e,goal,e.r,false,e)&&!firstWallHit(goal,base,0))return base;
 let cache=e.baseRouteCache;
 if(!cache||cache.revision!==state.navRevision||cache.until<=state.visualTime){
  let best=null,bestLength=Infinity;
  // Search only attack positions around the Base, never unrelated defensive targets.
  const angle=Math.atan2(e.y-base.y,e.x-base.x);
  for(let i=0;i<16;i++){
   const a=angle+i*Math.PI/8,p={x:base.x+Math.cos(a)*(reach-.6),y:base.y+Math.sin(a)*(reach-.6)};
   if(!freePosition(p,e.r,false,e)||firstWallHit(p,base,0))continue;
   const route=clearTravel(e,p,e.r,false,e)?[p]:findRoute(e,p);if(!route.length)continue;
   let previous=e,length=0;for(const point of route){length+=dist(previous,point);previous=point}
   if(length<bestLength){bestLength=length;best=p}
  }
  cache=e.baseRouteCache={revision:state.navRevision,until:state.visualTime+.8,goal:best};
 }
 if(cache.goal){e.breachGoal=cache.goal;return base}
 // Only obstacles intersecting the current approach to the Base are siege targets.
 const wallHit=firstWallHit(e,goal,e.r);let blocker=wallHit?.wall,time=wallHit?.time??Infinity;
 for(const t of state.towers){if(t.hp<=0)continue;const hit=segmentHitTime(e.x,e.y,goal.x,goal.y,t,e.r+t.r);if(hit!==null&&hit<time){blocker=t;time=hit}}
 return blocker||base;
}

function heroAllowed(id,s=saveData){return id==='archer'||id==='swordsman'&&(PATCH405_CONFIG.testUnlockAll||s.baseLevel>=2)}

function updateHeroBurn(dt){for(const e of state.enemies){if(!e.heroBurn||e.hp<=0)continue;const t=Math.min(dt,e.heroBurn.remaining);damageEnemy(e,e.heroBurn.dps*t,'player',{x:e.x,y:e.y,heroBurn:true},true);e.heroBurn.remaining-=t;if(e.heroBurn.remaining<=0)e.heroBurn=null}}

function drawHeroProtection(){const p=state.player;if(p.hp<=0||!(p.invulnerable>0))return;ctx.save();ctx.globalAlpha=.55+.2*Math.sin(state.visualTime*12);circle(p.x,p.y,p.r+7,'rgba(120,230,255,.18)','#b9f5ff');ctx.fillStyle='#dcffff';ctx.textAlign='center';ctx.font='bold 10px system-ui';ctx.fillText('INVULNERABLE',p.x,p.y-p.r-13);ctx.restore()}

function beginFirstWave(){if(!state.preRun||gameMode!==GAME_STATES.BETWEEN_WAVES)return false;state.preRun=false;state.between=false;state.spawnQueue=wavePlan(1);state.spawnTimer=0;prepareWaveEvents();state.notice='WAVE 1';state.noticeT=1.5;setMode(GAME_STATES.PLAYING);saveBestRun();return true}

function newPerformance(){return {towers:{},powers:{},hero:{class:state.runHeroClass,damage:0,kills:0,damageTaken:0,healing:0,deaths:0},otherDamage:0}}

function towerPerformance(type){const perf=state.run?.performance;if(!perf)return null;return perf.towers[type]??={built:0,maxLevel:1,damage:0,kills:0,areaDamage:0,chainDamage:0,slowEnemySeconds:0,spawned:0,unitDamageTaken:0}}

function powerPerformance(id){const perf=state.run?.performance;if(!perf||!id)return null;return perf.powers[id]??={uses:0,damage:0,kills:0,healing:0}}

function recordEnemyDamage(e,amount,source,hit,killed){
 const perf=state.run?.performance;if(!perf||amount<=0)return;
 const type=source==='soldier'?'barracks':source==='tower'?(hit?.towerType||hit?.type):null,power=source==='player'?hit?.powerId:null;
 const record=type?towerPerformance(type):power?powerPerformance(power):source==='player'?perf.hero:null;
 if(record){record.damage+=amount;if(killed)record.kills++;if(type){if(type==='flame'||type==='cryo'||hit?.area)record.areaDamage+=amount;if(hit?.multi)record.chainDamage+=amount}}
 else perf.otherDamage+=amount;
}

function recordPowerUse(id){const p=powerPerformance(id);if(p)p.uses++}

function saveBestRun(){
 const run=state.run;if(!run?.performance||state.preRun)return;const old=saveData.bestJungleRun,wave=state.wave;
 if(old&&old.id!==run.id&&(old.wave>wave||old.wave===wave&&old.survivalTime>=run.survivalTime))return;
 saveData.bestJungleRun=JSON.parse(JSON.stringify({id:run.id,wave,survivalTime:run.survivalTime,testMode:PATCH405_CONFIG.testUnlockAll,performance:run.performance,hero:{class:state.runHeroClass,skills:state.runHeroSkills,deaths:run.playerDeaths},towers:state.towers.map(t=>({type:t.type,slot:t.slot,level:t.level,destroyed:t.hp<=0})),powers:state.powerUps.map(p=>({id:p.id,level:p.level})),totalKills:run.totalKills,heroKillCredit:run.playerKills}));saveData.bestWave=Math.max(saveData.bestWave,wave);persistSave();
}

function renderBestRun(){
 const b=saveData.bestJungleRun;if(!b)return '<p>No recorded Jungle run yet. Start Wave 1 to record your setup.</p>';
 const num=v=>Math.round(v||0),table=(heads,rows)=>`<div style="overflow-x:auto"><table class="best-table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 return `<h2>JUNGLE · WAVE ${num(b.wave)}</h2><p>${formatTime(b.survivalTime)} · ${b.testMode?'Test Mode run':'Normal run'} · ${num(b.totalKills)} total kills</p><p>Hero: ${b.hero.class==='swordsman'?'SWORDSMAN':'ARCHER'} · ${num(b.performance.hero.damage)} direct / burn damage · ${num(b.performance.hero.kills)} kills · ${num(b.hero.deaths)} deaths</p><p>Damage received: ${num(b.performance.hero.damageTaken)} · Healing: ${num(b.performance.hero.healing)}</p><h2>TOWER CONTRIBUTIONS</h2>${table(['Tower','Built','Peak level','Damage','Kills','Area / chain damage','Utility'],Object.entries(b.performance.towers).filter(([type])=>towerDefs[type]).map(([type,t])=>[towerDefs[type].name,num(t.built),num(t.maxLevel),num(t.damage),num(t.kills),num(t.areaDamage)+' / '+num(t.chainDamage),type==='cryo'?num(t.slowEnemySeconds)+' slowed enemy-seconds':type==='barracks'?num(t.spawned)+' units · '+num(t.unitDamageTaken)+' damage tanked':'—']))}<h2>POWER-UPS</h2>${table(['Power','Uses','Damage','Kills','Healing'],Object.entries(b.performance.powers).filter(([id])=>POWER_UP_CONFIG[id]).map(([id,p])=>[POWER_UP_CONFIG[id].name,num(p.uses),num(p.damage),num(p.kills),num(p.healing)]))}<h2>RECORDED SETUP</h2><p>${b.towers.filter(t=>towerDefs[t.type]).map(t=>towerDefs[t.type].name+' · spot '+(num(t.slot)+1)+' · L'+num(t.level)+(t.destroyed?' · DESTROYED':'')).join('<br>')||'No towers'}</p><p>${b.powers.filter(p=>POWER_UP_CONFIG[p.id]).map(p=>POWER_UP_CONFIG[p.id].name+' L'+num(p.level)).join(' · ')||'No equipped powers'}</p><small>Damage counts actual HP removed. Slow measures affected enemy-seconds, not kills. No single “best tower” score.</small>`;
}

addEventListener('pagehide',()=>saveBestRun());
function loop(ts){resize();let dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);updateMeta(dt);draw();raf=requestAnimationFrame(loop)}
reset();
renderMeta();
requestAnimationFrame(loop);
</script>
</body></html>
